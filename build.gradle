plugins {
    id 'java' apply false
}

subprojects {
    group = 'com.example.manageddeviceinventory'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
